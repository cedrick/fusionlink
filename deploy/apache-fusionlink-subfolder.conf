<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    DocumentRoot /media/fusion/FusionHD1/www/html/allinjuanservices

    <Directory /media/fusion/FusionHD1/www/html/allinjuanservices>
        AllowOverride All
        Require all granted
    </Directory>

    Alias /fusionlink/ /media/fusion/FusionHD1/www/html/fusionlink/public/

    <Directory /media/fusion/FusionHD1/www/html/fusionlink/public>
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    RedirectMatch 301 ^/fusionlink$ /fusionlink/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
